[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlsrwf"
version = "1.0.0"
description = "Reproducible ConvLSTM prototype for short-range weather-image forecasting over Pakistan"
readme = "README.md"
requires-python = ">=3.10,<3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "matplotlib>=3.7,<3.9",
    "numpy>=1.23.5,<2",
    "PyYAML>=6,<7",
    "tensorflow>=2.15,<2.16",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.25,<7",
    "jupyterlab>=4,<5",
    "nbconvert>=7.10,<8",
]
dev = [
    "build>=1,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.15,<0.16",
]

[project.urls]
Repository = "https://github.com/IAMIQBAL/Deep-Learning-for-Short-Range-Weather-Forecasts"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["dlsrwf"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
    ".legacy_archive",
    "artifacts",
    "data",
    "notebooks",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
docstring-code-format = true
