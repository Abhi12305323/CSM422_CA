# Copy the untracked historical array to data/local before training.
schema_version: 1

experiment:
  name: precipitation_v1_corrected
  output_dir: ../outputs/precipitation

data:
  path: ../data/local/prec81-21.npy
  validation_fraction: 0.1
  split_strategy: chronological
  seed: 42
  scale: true

model:
  variant: causal
  filters: [64, 32, 32]
  kernel_sizes: [5, 3, 1]
  dropout: 0.1
  l2: 0.0001
  batch_norm: true
  output_channels: 1
  output_activation: sigmoid
  weights:

training:
  batch_size: 4
  epochs: 30
  learning_rate: 0.001
  loss: mse
  early_stopping_patience: 6
  reduce_lr_patience: 3
  minimum_learning_rate: 0.000001
  seed: 42

evaluation:
  context_steps: 12
  horizon: 12
  test_path: ../data/sample/precipitation_2022.npy
