# Bundled sample configuration. The persistence benchmark does not import
# TensorFlow. Metrics remain in legacy grayscale image space.
schema_version: 1

experiment:
  name: sample_precipitation
  output_dir: ../outputs/sample_precipitation

data:
  path: ../data/sample/precipitation_2022.npy
  validation_fraction: 0.2
  split_strategy: chronological
  seed: 42
  scale: true

model:
  variant: causal
  filters: [16, 8]
  kernel_sizes: [3, 3]
  dropout: 0.1
  l2: 0.0001
  batch_norm: true
  output_channels: 1
  output_activation: sigmoid
  weights:

training:
  batch_size: 2
  epochs: 5
  learning_rate: 0.001
  loss: mse
  early_stopping_patience: 2
  reduce_lr_patience: 1
  minimum_learning_rate: 0.000001
  seed: 42

evaluation:
  context_steps: 12
  horizon: 12
