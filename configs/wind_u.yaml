# The ten-frame daily-average source supports a five-frame context/horizon.
schema_version: 1

experiment:
  name: wind_u_v1_corrected
  output_dir: ../outputs/wind_u

data:
  path: ../data/local/WindU1940-2022-DailyAvg.npy
  validation_fraction: 0.1
  split_strategy: chronological
  seed: 42
  scale: true

model:
  variant: causal
  filters: [64, 64]
  kernel_sizes: [5, 1]
  dropout: 0.1
  l2: 0.0001
  batch_norm: true
  output_channels: 1
  output_activation: sigmoid
  weights:

training:
  batch_size: 4
  epochs: 30
  learning_rate: 0.001
  loss: mse
  early_stopping_patience: 6
  reduce_lr_patience: 3
  minimum_learning_rate: 0.000001
  seed: 42

evaluation:
  context_steps: 5
  horizon: 5
  test_path: ../data/local/WindU2023Test.npy
